  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 24px 80px;
    }

    .card {
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    .check-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #f0faf4;
      border: 2px solid #d1f0dd;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .check-circle svg { width: 36px; height: 36px; color: #22a855; }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.6); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: clamp(22px, 3.2vw, 30px);
      font-weight: 800;
      letter-spacing: -0.015em;
      line-height: 1.3;
      color: #111;
      margin-bottom: 14px;
      animation: fadeUp 0.5s 0.1s ease both;
    }

    .subtitle {
      font-size: 17px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 16px;
      animation: fadeUp 0.5s 0.2s ease both;
    }

    .subtitle.small {
      font-size: 15px;
      color: #999;
      margin-bottom: 44px;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, #e8e8e8, transparent);
      margin: 8px 0 36px;
      animation: fadeUp 0.5s 0.3s ease both;
    }

    .yt-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 15.5px;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      background: linear-gradient(160deg, #e8332a 0%, #b01f18 100%);
      padding: 16px 28px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(212,43,34,0.25);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
      animation: fadeUp 0.5s 0.4s ease both;
    }
    .yt-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(212,43,34,0.35);
    }
    .yt-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

    .footer-note {
      font-size: 13px;
      color: #bbb;
      margin-top: 48px;
      animation: fadeUp 0.5s 0.5s ease both;
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="check-circle">
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 18l7 7 13-13" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1>Браво, че предприе тази стъпка!</h1>
    <p class="subtitle">Поръчката ти е приета.</p>
    <p class="subtitle small">Тъй като плащането е с наложен платеж, бонусите и всичко останало ще получиш след като вземеш своята пратка.</p>

    <div class="divider"></div>

    <a class="yt-btn" href="https://www.youtube.com/@denisdimovtips" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4L15.8 12l-6.2 3.6Z"/></svg>
      Гледай още от Денис в YouTube
    </a>

    <p class="footer-note">Ако имаш въпроси, свържи се с нас. Очакваме те!</p>

  </div>
</body>
</html>
