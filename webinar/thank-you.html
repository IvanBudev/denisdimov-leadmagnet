  <style>
    .ty-wrap {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 0 auto;
      padding: 72px 20px 80px;
      text-align: center;
    }
    .ty-check {
      width: 68px;
      height: 68px;
      margin: 0 auto 26px;
      border-radius: 50%;
      background: rgba(224,199,135,0.14);
      border: 1.5px solid rgba(224,199,135,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
    }
    .ty-check svg { width: 30px; height: 30px; }
    .ty-wrap h1 {
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-size: clamp(25px, 5vw, 34px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 14px;
    }
    .ty-wrap p.lead {
      color: var(--text-2);
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 30px;
    }
    .ty-redirect {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 26px 24px;
      margin-bottom: 26px;
    }
    .ty-redirect p {
      font-size: 15px;
      color: var(--text-2);
      line-height: 1.7;
      margin: 0 0 20px;
    }
    .ty-redirect p strong { color: var(--text); }
    .ty-counter {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 14px;
      color: var(--muted);
    }
    .ty-counter .ty-dot {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 50%;
      background: rgba(224,199,135,0.12);
      border: 1.5px solid rgba(224,199,135,0.4);
      color: var(--gold);
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ty-fallback {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }
    .ty-fallback a { color: var(--gold); }
  </style>

<body>

<div class="noise" aria-hidden="true"></div>
<div class="glow" aria-hidden="true"></div>

<div class="ty-wrap">
  <div class="ty-check" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5 9.5 18 20 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <h1>Мястото ти е запазено</h1>

  <div class="ty-redirect">
    <p>
      Уебинарът ще се провежда във <strong>Viber група</strong>. В момента те прехвърляме
      към нея — там ще научиш повече подробности за събитието.
    </p>
    <div class="ty-counter">
      <span class="ty-dot" id="ty-count">6</span>
      <span>Прехвърляме те след няколко секунди…</span>
    </div>
  </div>

  <p class="ty-fallback">
    Не се ли прехвърли автоматично? <a id="viber-link" href="#" target="_blank" rel="noopener">Влез във Viber групата оттук</a>.
  </p>
</div>

<script>
  /* ═══ Смени тук с реалния линк към Viber групата ═══ */
  var VIBER_GROUP_URL = 'https://invite.viber.com/?g2=REPLACE_WITH_REAL_INVITE_LINK';
  var REDIRECT_SECONDS = 6;

  document.getElementById('viber-link').href = VIBER_GROUP_URL;

  var countEl = document.getElementById('ty-count');
  var remaining = REDIRECT_SECONDS;

  var tick = setInterval(function () {
    remaining -= 1;
    if (remaining <= 0) {
      clearInterval(tick);
      countEl.textContent = '0';
      window.location.href = VIBER_GROUP_URL;
    } else {
      countEl.textContent = remaining;
    }
  }, 1000);
</script>

</body>
